name: ci

on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test --no-run
      - name: Root watchdog for stopped processes
        run: |
          cat > /tmp/wd.sh <<'EOS'
          #!/bin/bash
          while true; do
            sleep 1
            n=$(ps -axo stat=,user= | awk '$1 ~ /^T/ && $2 == "runner"' | wc -l | tr -d ' ')
            if [ "$n" -gt 15 ]; then
              {
                echo "STOPPED $n processes at $(date -u +%T)"
                ps -axo pid,ppid,user,stat,etime,command | awk 'NR==1 || $4 ~ /^T/' | head -40 | cut -c1-200
                echo "--- test processes"
                ps -axo pid,ppid,stat,etime,command | grep -E "target/debug|helper_|sleep|sh -c" | grep -v grep | cut -c1-220
                echo "--- log tail"
                tail -40 /tmp/test.log
              } >> /tmp/wd.log
              pkill -CONT -u runner
              sleep 5
              pkill -CONT -u runner
            fi
          done
          EOS
          chmod +x /tmp/wd.sh
          sudo nohup /tmp/wd.sh > /dev/null 2>&1 &
      - name: Plain cargo test, twice
        run: |
          set +e
          for round in 1 2; do
            echo "=== round $round"
            perl -e 'alarm shift; exec @ARGV' 300 cargo test > /tmp/test.log 2>&1
            echo "exit $?"
            grep -E "test result|running for over|panicked|FAILED" /tmp/test.log
            pkill -9 -f 'target/debug/deps'
          done
          echo "--- watchdog log"
          cat /tmp/wd.log 2>/dev/null || echo "(nothing stopped)"
