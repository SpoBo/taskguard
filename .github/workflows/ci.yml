name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test --no-run
      - name: Each test alone, 120 s each
        run: |
          (while true; do date -u +%T; vm_stat | head -6; sleep 15; done) &
          for bin in "--bin taskguard" "--test cli"; do
            for t in $(cargo test $bin -- --list 2>/dev/null | grep ': test$' | sed 's/: test$//'); do
              start=$(date +%s)
              perl -e 'alarm shift; exec @ARGV' 120 cargo test -q $bin -- --exact "$t" >/tmp/out.txt 2>&1
              code=$?
              echo "$code $(( $(date +%s) - start ))s $bin $t"
              [ $code -ne 0 ] && tail -30 /tmp/out.txt
            done
          done
