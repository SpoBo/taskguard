name: ci

on:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build && cargo test --no-run
      - name: Machine as taskguard sees it
        run: |
          set +e
          sysctl hw.memsize hw.ncpu
          vm_stat
          memory_pressure | tail -3
          TASKGUARD_DIR=/tmp/tgs target/debug/taskguard -- sh -c 'sleep 1'
          TASKGUARD_DIR=/tmp/tgs target/debug/taskguard status | head -12
      - name: CLI tests in parallel, 10 min
        run: |
          set +e
          (while true; do sleep 20; date -u +%T; ps -axo pid,ppid,rss,etime,command | grep -E 'taskguard|helper_|sleep' | grep -v grep | cut -c1-200; done) &
          perl -e 'alarm shift; exec @ARGV' 600 cargo test --test cli 2>&1
          echo "exit $?"
