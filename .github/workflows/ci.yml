name: ci

on:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Root watchdog for the test step
        run: |
          cat > /tmp/wd.sh <<'EOS'
          #!/bin/bash
          # Wait for the test step to start, then give it 6 minutes.
          until pgrep -f 'cargo test' >/dev/null; do sleep 1; done
          sleep 360
          {
            echo "=== still running after 6 min at $(date -u +%T)"
            ps -axo pid,ppid,user,stat,etime,command | grep -E "runner" | grep -vE "Runner\.|/System/|/usr/libexec|/usr/sbin" | cut -c1-220
            echo "=== open pipes of runner processes"
            lsof -nP -u runner 2>/dev/null | grep -E "PIPE|FIFO" | grep -vE "^(Runner|Spotlight)" | head -80
          } > /tmp/wd.log 2>&1
          pkill -9 -f 'target/debug'
          pkill -9 cargo
          EOS
          chmod +x /tmp/wd.sh
          sudo nohup /tmp/wd.sh > /dev/null 2>&1 &
      - name: Test
        run: cargo test
      - name: Watchdog log
        if: always()
        run: cat /tmp/wd.log 2>/dev/null || echo "(the test step ended within 6 minutes)"
